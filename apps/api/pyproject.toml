[project]
name = "veste-ai-api"
version = "0.1.0"
description = "VESTE.AI - API e motor de recomendacao de tamanho e caimento (MVP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]
# Modulo experimental de visao computacional. A aplicacao funciona sem ele.
vision = ["opencv-python-headless>=4.9", "mediapipe>=0.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
