      <stop offset="0" stop-color="#EFE9E1"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="fab-vestido-midi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4623A" stop-opacity="1"/>
      <stop offset="1" stop-color="#C4623A" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="shadow-vestido-midi" x="-20%" y="-20%" width="140%" height="140%">
